name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_CACHE_KEY: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift', 'Tests/**/*.swift') }}

jobs:
  build-tests:
    name: Build (tests)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ env.BUILD_CACHE_KEY }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build test binaries
        run: swift build --build-tests -v

  test:
    name: Test (${{ matrix.suite.name }})
    needs: build-tests
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: unit
            filter: 'SmokeTests|RepoModelsTests|SafetyRailsTests|GitleRunnerTests|RepoStoreTests|ShellTests'
          - name: integration
            filter: 'IntegrationTests'
          - name: e2e
            filter: 'E2ETests'
          - name: functional
            filter: 'FunctionalTests'
          - name: performance
            filter: 'PerformanceTests'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Restore built test binaries
        uses: actions/cache/restore@v4
        with:
          path: .build
          key: ${{ env.BUILD_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Run ${{ matrix.suite.name }} tests
        run: swift test --skip-build --parallel --filter '${{ matrix.suite.filter }}'

  smoke:
    name: App Smoke Launch
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ env.BUILD_CACHE_KEY }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Bundle and launch real .app
        run: scripts/smoke-launch.sh release
